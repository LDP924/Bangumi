name: Sync upstream

on:
  schedule:
    - cron: '0 4,16 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync with upstream
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # 用 PAT 而非 GITHUB_TOKEN：上游 merge 可能携带 .github/workflows 变更，
          # GITHUB_TOKEN 没有 workflows 权限，push 会被拒 (refusing to allow a GitHub App...)
          token: ${{ secrets.SYNC_PAT }}

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Configure custom merge driver for advance.json
        run: |
          git config merge.advance-json.driver "python3 .github/scripts/merge-advance-json.py %O %A %B"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/czy0729/Bangumi.git || true
          git remote -v

      - name: Fetch upstream
        run: git fetch upstream --tags --force

      - name: Check for new commits
        id: check
        run: |
          set -euo pipefail

          UPSTREAM_COMMIT=$(git rev-parse upstream/master)
          LOCAL_COMMIT=$(git rev-parse origin/master)

          if [ "$UPSTREAM_COMMIT" = "$LOCAL_COMMIT" ]; then
            echo "No new commits from upstream"
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            COMMIT_COUNT=$(git rev-list origin/master..upstream/master --count)

            if [ "$COMMIT_COUNT" -eq 0 ]; then
              echo "Local is ahead of upstream (user changes only), no upstream updates to sync"
              echo "has_updates=false" >> "$GITHUB_OUTPUT"
            else
              echo "New commits from upstream: $COMMIT_COUNT"
              echo "has_updates=true" >> "$GITHUB_OUTPUT"
              echo "upstream_commit=$UPSTREAM_COMMIT" >> "$GITHUB_OUTPUT"
              echo "commit_count=$COMMIT_COUNT" >> "$GITHUB_OUTPUT"

              {
                echo "commit_messages<<EOF"
                git log origin/master..upstream/master --pretty=format:"- %s (%h)" --no-merges
                echo ""
                echo "EOF"
              } >> "$GITHUB_OUTPUT"

              echo "=== New commits ==="
              git log origin/master..upstream/master --pretty=format:"- %s (%h, %cr)" --no-merges
              echo ""
            fi
          fi

      - name: Test merge for conflicts
        if: steps.check.outputs.has_updates == 'true'
        id: conflicts
        run: |
          set -euo pipefail

          git checkout -b upstream-sync-test

          set +e
          git merge upstream/master --no-commit --no-ff > /tmp/merge-output.txt 2>&1
          MERGE_EXIT=$?
          set -e

          cat /tmp/merge-output.txt

          CONFLICT_FILES=$(git diff --name-only --diff-filter=U 2>/dev/null || true)

          if [ -n "$CONFLICT_FILES" ]; then
            echo "Conflicts detected in files:"
            echo "$CONFLICT_FILES"
            echo "has_conflicts=true" >> "$GITHUB_OUTPUT"
            {
              echo "conflict_files<<EOF"
              echo "$CONFLICT_FILES"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "No conflicts"
            echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
          fi

          git merge --abort 2>/dev/null || true
          git checkout master
          git branch -D upstream-sync-test 2>/dev/null || true

      - name: Close stale sync PR
        if: steps.check.outputs.has_updates == 'true' && steps.conflicts.outputs.has_conflicts == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          EXISTING=$(gh pr list --head upstream-sync-pr --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            gh pr close "$EXISTING" --comment "关闭旧的同步 PR，重新创建以包含最新上游改动。"
            git push origin --delete upstream-sync-pr 2>/dev/null || true
          fi

      - name: Create Pull Request for manual review
        if: steps.check.outputs.has_updates == 'true' && steps.conflicts.outputs.has_conflicts == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git checkout -b upstream-sync-pr
          git merge upstream/master --no-edit 2>&1 || true
          git add -A 2>/dev/null || true
          git commit -m "Merge upstream/master (conflicts need manual resolution)" --no-verify 2>/dev/null || true
          git push origin upstream-sync-pr --force

          COMMIT_COUNT="${{ steps.check.outputs.commit_count }}"
          COMMIT_MESSAGES="${{ steps.check.outputs.commit_messages }}"
          CONFLICT_LIST="${{ steps.conflicts.outputs.conflict_files }}"
          UPSTREAM_COMMIT="${{ steps.check.outputs.upstream_commit }}"

          PR_BODY=$(cat <<BODY
          ## 上游同步 — 检测到冲突，需手动解决

          上游仓库 [czy0729/Bangumi](https://github.com/czy0729/Bangumi) 有 **${COMMIT_COUNT} 个新提交**。

          ### 新提交列表

          ${COMMIT_MESSAGES}

          ### 冲突文件

          \`\`\`
          ${CONFLICT_LIST}
          \`\`\`

          请解决冲突后合并此 PR。

          ---

          上游提交: ${UPSTREAM_COMMIT}
          BODY
          )

          # 幂等创建 label（不存在时创建，已存在时报错但忽略）
          # [修复 2026-08-22] #396-398 失败根因：'upstream-sync' label 不存在，
          # gh pr create --label 直接报错退出
          gh label create "upstream-sync" \
            --color 0e8a16 \
            --description "自动同步上游产生的 PR" 2>/dev/null || true

          gh pr create \
            --title "同步上游（${COMMIT_COUNT} 个新提交，需手动解决冲突）" \
            --body "$PR_BODY" \
            --base master \
            --head upstream-sync-pr \
            --label "upstream-sync"

          echo "::notice::PR 已创建: https://github.com/${{ github.repository }}/pulls"

      - name: Auto merge without conflicts
        if: steps.check.outputs.has_updates == 'true' && steps.conflicts.outputs.has_conflicts == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git checkout master
          git merge upstream/master --no-edit
          git push origin master

          echo "=== 同步完成 ==="
          echo "合并的上游提交:"
          git log HEAD~${{ steps.check.outputs.commit_count }}..HEAD --pretty=format:"- %s (%h)" --no-merges

      - name: Trigger APK build
        if: steps.check.outputs.has_updates == 'true' && steps.conflicts.outputs.has_conflicts == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 5
          curl -fsSL -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-upstream-apk.yml/dispatches" \
            -d '{"ref":"master"}'
          echo "已触发 APK 构建工作流"

      - name: No updates
        if: steps.check.outputs.has_updates == 'false'
        run: echo "已与上游同步，无新提交"
