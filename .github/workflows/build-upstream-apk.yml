name: Build upstream signed APK

on:
  schedule:
    - cron: '37 8 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream Bangumi tag to build, for example 8.32.3. Leave empty for latest semantic tag.'
        required: false
        type: string
      force:
        description: 'Rebuild and replace existing release assets.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: build-upstream-apk-${{ github.event.inputs.tag || 'latest' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout automation
        uses: actions/checkout@v5

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK versions
        run: |
          yes | sdkmanager "ndk;23.1.7779620" > /dev/null 2>&1 || true
          yes | sdkmanager "ndk;27.1.12297006" > /dev/null 2>&1 || true

      - name: Cache Yarn global cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yarn
            ~/.cache/node
          key: yarn-global-${{ runner.os }}
          restore-keys: |
            yarn-global-${{ runner.os }}

      - name: Resolve upstream tag
        id: upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ github.event.inputs.tag || '' }}
          FORCE_REBUILD: ${{ github.event.inputs.force == 'true' }}
        run: node .github/scripts/upstream-apk.mjs resolve

      - name: Skip existing APK
        if: steps.upstream.outputs.should_build != 'true'
        run: echo "APK asset ${{ steps.upstream.outputs.asset_name }} already exists on release ${{ steps.upstream.outputs.release_tag }}."

      - name: Decode Android keystore
        if: steps.upstream.outputs.should_build == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$GITHUB_WORKSPACE/Bangumi.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Keystore file is empty (0 bytes) at $KEYSTORE_PATH"
            echo "::error::This means the ANDROID_KEYSTORE_BASE64 secret is not set or is empty."
            echo "::error::Go to Settings > Secrets and variables > Actions and verify ANDROID_KEYSTORE_BASE64 exists."
            exit 1
          fi

          echo "Keystore size: $(stat -c%s "$KEYSTORE_PATH") bytes"

          keytool -list -keystore "$KEYSTORE_PATH" -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" 2>&1 | head -5 || echo "::warning::keytool verification failed"

      - name: Download upstream source
        if: steps.upstream.outputs.should_build == 'true'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          source_zip="$RUNNER_TEMP/bangumi-$TAG.zip"
          source_dir="$RUNNER_TEMP/Bangumi-$TAG"

          rm -rf "$source_dir" "$source_zip"
          curl -fsSL "https://github.com/czy0729/Bangumi/archive/refs/tags/$TAG.zip" -o "$source_zip"
          unzip -q "$source_zip" -d "$RUNNER_TEMP"

          if [ ! -d "$source_dir" ]; then
            echo "::error::Expected source directory not found: $source_dir"
            exit 1
          fi

          source_dir="$(cd "$source_dir" && pwd -P)"
          echo "SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"

      - name: Prepare APK source
        if: steps.upstream.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          node packages/env.js android

          if [ -f android/rust/build-android.sh ]; then
            sed 's/darwin-x86_64/linux-x86_64/g' android/rust/build-android.sh > android/rust/build-android-linux.sh
            chmod +x android/rust/build-android-linux.sh
          fi

          sed -i 's|https\\://mirrors.cloud.tencent.com/gradle/|https\\://services.gradle.org/distributions/|g' android/gradle/wrapper/gradle-wrapper.properties || true

          cp android/gradle_yours.properties android/gradle.properties

          sed -i '/^org\.gradle\.configureondemand=/d' android/gradle.properties
          sed -i '/^org\.gradle\.configuration-cache=/d' android/gradle.properties
          sed -i '/^org\.gradle\.daemon=/d' android/gradle.properties
          echo 'org.gradle.configureondemand=false' >> android/gradle.properties

          sed -i '/^MYAPP_RELEASE_STORE_FILE=/d' android/gradle.properties
          sed -i '/^MYAPP_RELEASE_KEY_ALIAS=/d' android/gradle.properties
          sed -i '/^MYAPP_RELEASE_STORE_PASSWORD=/d' android/gradle.properties
          sed -i '/^MYAPP_RELEASE_KEY_PASSWORD=/d' android/gradle.properties

          echo "--- gradle.properties (signing lines removed, will use -P) ---"
          grep -n "MYAPP_RELEASE" android/gradle.properties || echo "(confirmed: no MYAPP_RELEASE lines in file)"

          node <<'NODE'
          const fs = require('fs')

          function readJson(path) {
            return JSON.parse(fs.readFileSync(path, 'utf8'))
          }

          function writeJson(path, value) {
            fs.writeFileSync(path, `${JSON.stringify(value, null, 2)}\n`)
          }

          const pkg = readJson('package.json')
          pkg.dependencies ||= {}
          if (!pkg.dependencies['expo-speech']) {
            pkg.dependencies['expo-speech'] = '~13.0.1'
            writeJson('package.json', pkg)
            console.log('Added expo-speech for the APK dependency set')
          }

          const appJson = readJson('app.json')
          const plugins = appJson.expo?.plugins
          if (Array.isArray(plugins)) {
            const filtered = plugins.filter(plugin => {
              if (plugin === 'expo-web-browser') return false
              return !(Array.isArray(plugin) && plugin[0] === 'expo-web-browser')
            })

            if (filtered.length !== plugins.length) {
              appJson.expo.plugins = filtered
              writeJson('app.json', appJson)
              console.log('Removed expo-web-browser config plugin for Expo 52 APK builds')
            }
          }

          const appVersion = appJson.expo?.version
          if (!appVersion) {
            throw new Error('app.json is missing expo.version')
          }

          fs.appendFileSync(process.env.GITHUB_ENV, `APP_VERSION=${appVersion}\n`)
          NODE

          app_version="$(node -p "require('./app.json').expo.version")"
          echo "App version: $app_version"

      - name: Install JavaScript dependencies
        if: steps.upstream.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

          yarn install --ignore-engines --ignore-scripts --network-timeout 600000

          ./node_modules/.bin/patch-package --patch-dir packages/android/patches || echo "::warning::Some Android patch-package patches did not apply; continuing for Android build."

      - name: Build Rust native library
        if: steps.upstream.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR/android/rust"

          if [ ! -f build-android-linux.sh ]; then
            echo "No Rust build script found, skipping."
            exit 0
          fi

          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"

          echo "y" | bash build-android-linux.sh || echo "::warning::Rust build failed; continuing without native library."

      - name: Build Release APK
        if: steps.upstream.outputs.should_build == 'true'
        env:
          NODE_ENV: production
          ENTRY_FILE: index.js
          MYAPP_RELEASE_STORE_FILE: ${{ env.KEYSTORE_PATH }}
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR/android"

          chmod +x ./gradlew

          echo "=== Signing config check ==="
          echo "Keystore: $MYAPP_RELEASE_STORE_FILE"
          echo "Alias: $MYAPP_RELEASE_KEY_ALIAS"
          if [ ! -f "$MYAPP_RELEASE_STORE_FILE" ]; then
            echo "::error::Keystore not found: $MYAPP_RELEASE_STORE_FILE"
            exit 1
          fi
          echo "Keystore size: $(stat -c%s "$MYAPP_RELEASE_STORE_FILE") bytes"

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -PMYAPP_RELEASE_STORE_FILE="$MYAPP_RELEASE_STORE_FILE" \
            -PMYAPP_RELEASE_STORE_PASSWORD="$MYAPP_RELEASE_STORE_PASSWORD" \
            -PMYAPP_RELEASE_KEY_ALIAS="$MYAPP_RELEASE_KEY_ALIAS" \
            -PMYAPP_RELEASE_KEY_PASSWORD="$MYAPP_RELEASE_KEY_PASSWORD" \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError" \
            -Dorg.gradle.parallel=true

      - name: Package APK
        if: steps.upstream.outputs.should_build == 'true'
        env:
          ASSET_NAME: ${{ steps.upstream.outputs.asset_name }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          apk_dir="android/app/build/outputs/apk/release"
          apk_path="$(ls "$apk_dir"/app-*-release.apk 2>/dev/null | head -1 || ls "$apk_dir"/app-release.apk 2>/dev/null | head -1)"

          if [ -z "$apk_path" ] || [ ! -f "$apk_path" ]; then
            echo "::error::No release APK found in $apk_dir/"
            echo "Directory contents:"
            ls -la "$apk_dir/" 2>/dev/null || true
            exit 1
          fi

          echo "Found APK: $apk_path"

          target_apk="$GITHUB_WORKSPACE/$ASSET_NAME"
          cp "$apk_path" "$target_apk"

          app_version="$(node -p "require('./app.json').expo.version")"
          if [ "$app_version" != "$TAG" ]; then
            echo "::warning::app.json version $app_version does not match upstream tag $TAG."
          fi

          cd "$GITHUB_WORKSPACE"
          shasum -a 256 "$ASSET_NAME" > "$ASSET_NAME.sha256"

          echo "APK_PATH=$target_apk" >> "$GITHUB_ENV"
          echo "SHA_PATH=$target_apk.sha256" >> "$GITHUB_ENV"

      - name: Validate APK
        if: steps.upstream.outputs.should_build == 'true'
        run: |
          set -euo pipefail

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK not found: $APK_PATH"
            exit 1
          fi

          apk_size="$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")"
          echo "APK size: $apk_size bytes"
          if [ "$apk_size" -lt 10485760 ]; then
            echo "::warning::APK size is less than 10MB: $apk_size bytes"
          fi

          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -name apksigner 2>/dev/null | head -1)"
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            echo "Verifying APK signature with: $APKSIGNER"
            "$APKSIGNER" verify --verbose "$APK_PATH"
            verify_exit=$?
            if [ $verify_exit -eq 0 ]; then
              echo "APK signature verified successfully"
            else
              echo "::error::APK signature verification failed (exit code: $verify_exit). The APK may be unsigned."
              echo "::error::This usually means the keystore secrets are incorrect or the keystore file is invalid."
              exit 1
            fi
          else
            echo "::warning::apksigner not found, skipping signature verification"
          fi

          echo "APK validation passed: $APK_PATH ($apk_size bytes)"

      - name: Upload release assets
        if: steps.upstream.outputs.should_build == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_REBUILD: ${{ github.event.inputs.force == 'true' }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: node .github/scripts/upstream-apk.mjs upload --tag "$TAG" --apk "$APK_PATH" --sha "$SHA_PATH"
