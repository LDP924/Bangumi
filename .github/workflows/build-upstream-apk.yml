name: Build upstream signed APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-upstream-apk
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 'latest'
          check-latest: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          check-latest: true
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK versions
        run: |
          yes | sdkmanager "ndk;23.1.7779620" > /dev/null 2>&1 || true
          yes | sdkmanager "ndk;27.1.12297006" > /dev/null 2>&1 || true

      - name: Cache Yarn global cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/yarn
            ~/.cache/node
          key: yarn-global-${{ runner.os }}
          restore-keys: |
            yarn-global-${{ runner.os }}

      - name: Resolve upstream version
        id: upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/upstream-apk.mjs resolve

      - name: Skip existing build
        if: steps.upstream.outputs.should_build != 'true'
        run: 'echo "Already built: ${{ steps.upstream.outputs.asset_name }}"'

      - name: Decode Android keystore
        if: steps.upstream.outputs.should_build == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$GITHUB_WORKSPACE/Bangumi.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Keystore file is empty (0 bytes) at $KEYSTORE_PATH"
            echo "::error::Verify ANDROID_KEYSTORE_BASE64 secret exists in Settings > Secrets and variables > Actions."
            exit 1
          fi

          echo "Keystore size: $(stat -c%s "$KEYSTORE_PATH") bytes"

      - name: Prepare APK source
        if: steps.upstream.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          node packages/env.js android

          if [ -f android/rust/build-android.sh ]; then
            sed 's/darwin-x86_64/linux-x86_64/g' android/rust/build-android.sh > android/rust/build-android-linux.sh
            chmod +x android/rust/build-android-linux.sh
          fi

          sed -i 's|https\\://mirrors.cloud.tencent.com/gradle/|https\\://services.gradle.org/distributions/|g' android/gradle/wrapper/gradle-wrapper.properties || true

          cp android/gradle_yours.properties android/gradle.properties

          sed -i '/^org\.gradle\.configureondemand=/d' android/gradle.properties
          sed -i '/^org\.gradle\.configuration-cache=/d' android/gradle.properties
          sed -i '/^org\.gradle\.daemon=/d' android/gradle.properties
          echo 'org.gradle.configureondemand=false' >> android/gradle.properties

          sed -i '/^MYAPP_RELEASE_STORE_FILE=/d' android/gradle.properties
          sed -i '/^MYAPP_RELEASE_KEY_ALIAS=/d' android/gradle.properties
          sed -i '/^MYAPP_RELEASE_STORE_PASSWORD=/d' android/gradle.properties
          sed -i '/^MYAPP_RELEASE_KEY_PASSWORD=/d' android/gradle.properties

          node <<'NODE'
          const fs = require('fs')

          function readJson(p) { return JSON.parse(fs.readFileSync(p, 'utf8')) }
          function writeJson(p, v) { fs.writeFileSync(p, `${JSON.stringify(v, null, 2)}\n`) }

          const appJson = readJson('app.json')
          const plugins = appJson.expo?.plugins
          if (Array.isArray(plugins)) {
            const filtered = plugins.filter(p => p !== 'expo-web-browser' && !(Array.isArray(p) && p[0] === 'expo-web-browser'))
            if (filtered.length !== plugins.length) {
              appJson.expo.plugins = filtered
              writeJson('app.json', appJson)
            }
          }

          if (!appJson.expo?.version) throw new Error('app.json is missing expo.version')
          NODE

      - name: Debug - Verify source files (pre-build)
        if: steps.upstream.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          echo "=== advance.json first 3 chars ==="
          head -c 3 src/assets/json/advance.json | xxd
          echo "=== advance.json contains 671062? ==="
          grep -c "671062" src/assets/json/advance.json || echo "NOT FOUND"
          echo "=== advance.json context around 670985 ==="
          grep -o '.\{0,10\}670985.\{0,60\}' src/assets/json/advance.json
          echo "=== computed.ts isDeveloper ==="
          grep -A2 "get isDeveloper" src/stores/user/computed.ts
          echo "=== computed.ts userInfo init ==="
          grep -A2 "get userInfo" src/stores/user/computed.ts | cat -A

      - name: Install JavaScript dependencies
        if: steps.upstream.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

          yarn install --ignore-engines --ignore-scripts --network-timeout 600000

          ./node_modules/.bin/patch-package --patch-dir packages/android/patches || echo "::warning::Some Android patch-package patches did not apply; continuing."

      - name: Debug - Verify source files (post-install)
        if: steps.upstream.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          echo "=== advance.json first 3 chars (post-install) ==="
          head -c 3 src/assets/json/advance.json | xxd
          echo "=== advance.json contains 671062? (post-install) ==="
          grep -c "671062" src/assets/json/advance.json || echo "NOT FOUND"
          echo "=== computed.ts isDeveloper (post-install) ==="
          grep -A2 "get isDeveloper" src/stores/user/computed.ts

      - name: Build Rust native library
        if: steps.upstream.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/android/rust"

          if [ ! -f build-android-linux.sh ]; then
            echo "No Rust build script found, skipping."
            exit 0
          fi

          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"

          echo "y" | bash build-android-linux.sh

      - name: Build Release APK
        if: steps.upstream.outputs.should_build == 'true'
        env:
          NODE_ENV: production
          MYAPP_RELEASE_STORE_FILE: ${{ env.KEYSTORE_PATH }}
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/android"

          chmod +x ./gradlew

          if [ ! -f "$MYAPP_RELEASE_STORE_FILE" ]; then
            echo "::error::Keystore not found: $MYAPP_RELEASE_STORE_FILE"
            exit 1
          fi

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -PMYAPP_RELEASE_STORE_FILE="$MYAPP_RELEASE_STORE_FILE" \
            -PMYAPP_RELEASE_STORE_PASSWORD="$MYAPP_RELEASE_STORE_PASSWORD" \
            -PMYAPP_RELEASE_KEY_ALIAS="$MYAPP_RELEASE_KEY_ALIAS" \
            -PMYAPP_RELEASE_KEY_PASSWORD="$MYAPP_RELEASE_KEY_PASSWORD" \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError" \
            -Dorg.gradle.parallel=true

      - name: Debug - Check bundle for 671062
        if: steps.upstream.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          BUNDLE=$(find android/app/build/generated -name "index.android.bundle" 2>/dev/null | head -1)
          if [ -z "$BUNDLE" ]; then
            echo "No bundle found in generated assets, searching alternative locations..."
            BUNDLE=$(find android/app/build -name "*.bundle" 2>/dev/null | head -1)
          fi
          if [ -n "$BUNDLE" ]; then
            echo "Bundle found: $BUNDLE"
            echo "=== 671062 in bundle? ==="
            strings "$BUNDLE" | grep -c "671062" || echo "NOT FOUND in strings"
            echo "=== 456208 in bundle? ==="
            strings "$BUNDLE" | grep -c "456208" || echo "NOT FOUND in strings"
            echo "=== advance data context ==="
            strings "$BUNDLE" | grep -o '.\{0,10\}670985.\{0,60\}' | head -3
          else
            echo "::warning::No bundle file found to inspect"
          fi

      - name: Package APK
        if: steps.upstream.outputs.should_build == 'true'
        env:
          ASSET_NAME: ${{ steps.upstream.outputs.asset_name }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          apk_dir="android/app/build/outputs/apk/release"
          apk_path="$(ls "$apk_dir"/app-*-release.apk 2>/dev/null | head -1 || ls "$apk_dir"/app-release.apk 2>/dev/null | head -1)"

          if [ -z "$apk_path" ] || [ ! -f "$apk_path" ]; then
            echo "::error::No release APK found in $apk_dir/"
            ls -la "$apk_dir/" 2>/dev/null || true
            exit 1
          fi

          target_apk="$GITHUB_WORKSPACE/$ASSET_NAME"
          cp "$apk_path" "$target_apk"
          echo "APK_PATH=$target_apk" >> "$GITHUB_ENV"

      - name: Build and package clone APK
        if: steps.upstream.outputs.should_build == 'true'
        env:
          NODE_ENV: production
          MYAPP_RELEASE_STORE_FILE: ${{ env.KEYSTORE_PATH }}
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CLONE_ASSET_NAME: ${{ steps.upstream.outputs.clone_asset_name }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/android"

          sed -i -E 's/applicationId "[^"]*"/applicationId "com.ldp924.bangumi"/' app/build.gradle

          rm -rf app/build/outputs/apk/release/

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -PMYAPP_RELEASE_STORE_FILE="$MYAPP_RELEASE_STORE_FILE" \
            -PMYAPP_RELEASE_STORE_PASSWORD="$MYAPP_RELEASE_STORE_PASSWORD" \
            -PMYAPP_RELEASE_KEY_ALIAS="$MYAPP_RELEASE_KEY_ALIAS" \
            -PMYAPP_RELEASE_KEY_PASSWORD="$MYAPP_RELEASE_KEY_PASSWORD" \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError" \
            -Dorg.gradle.parallel=true

          cd "$GITHUB_WORKSPACE"
          apk_dir="android/app/build/outputs/apk/release"
          apk_path="$(ls "$apk_dir"/app-*-release.apk 2>/dev/null | head -1 || ls "$apk_dir"/app-release.apk 2>/dev/null | head -1)"

          if [ -z "$apk_path" ] || [ ! -f "$apk_path" ]; then
            echo "::error::No clone APK found"
            exit 1
          fi

          target_apk="$GITHUB_WORKSPACE/$CLONE_ASSET_NAME"
          cp "$apk_path" "$target_apk"
          echo "CLONE_APK_PATH=$target_apk" >> "$GITHUB_ENV"

      - name: Validate APK
        if: steps.upstream.outputs.should_build == 'true'
        run: |
          set -euo pipefail

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK not found: $APK_PATH"
            exit 1
          fi

          apk_size="$(stat -c%s "$APK_PATH")"
          echo "APK size: $apk_size bytes"

          if [ "$apk_size" -lt 10485760 ]; then
            echo "::warning::APK size is less than 10MB: $apk_size bytes"
          fi

          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -name apksigner 2>/dev/null | head -1)"
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "$APK_PATH"
            verify_exit=$?
            if [ $verify_exit -eq 0 ]; then
              echo "APK signature verified"
            else
              echo "::error::APK signature verification failed (exit $verify_exit)"
              exit 1
            fi
          else
            echo "::warning::apksigner not found, skipping verification"
          fi

      - name: Upload release assets
        if: steps.upstream.outputs.should_build == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_TAG: ${{ steps.upstream.outputs.build_tag }}
          SOURCE_REF: ${{ steps.upstream.outputs.source_ref }}
          BUILD_MODE: ${{ steps.upstream.outputs.build_mode }}
        run: |
          set -euo pipefail

          if [ -z "${CLONE_APK_PATH:-}" ] || [ ! -f "${CLONE_APK_PATH:-}" ]; then
            echo "::error::Clone APK is missing — refusing to publish without clone"
            exit 1
          fi

          node .github/scripts/upstream-apk.mjs upload \
            --tag "$BUILD_TAG" \
            --apk "$APK_PATH" \
            --clone-apk "$CLONE_APK_PATH" \
            --source-ref "$SOURCE_REF" \
            --mode "$BUILD_MODE"
